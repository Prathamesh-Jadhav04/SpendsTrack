<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded Card Background with Vercel Blue-to-Purple Gradient -->
  <rect width="96" height="96" rx="24" fill="url(#paint0_linear)"/>
  
  <!-- Glowing Overlay Grid/Accent -->
  <rect x="2" y="2" width="92" height="92" rx="22" stroke="white" stroke-width="1.5" stroke-opacity="0.15"/>
  
  <!-- Sleek Fintech Geometric Symbol: An interlocking double-curve forming "S" & Growth Trend -->
  <g filter="url(#dropShadow)">
    <!-- Interlocking "S" Shape -->
    <path d="M30 58C30 62.4183 33.5817 66 38 66H58C62.4183 66 66 62.4183 66 58V50C66 45.5817 62.4183 42 58 42H38C33.5817 42 30 38.4183 30 34V26C30 21.5817 33.5817 18 38 18H58C62.4183 18 66 21.5817 66 26" 
          stroke="white" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Upward Trend Indicator Line emerging from the center to top-right -->
    <path d="M48 42L72 18" stroke="#50e3c2" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M60 18H72V30" stroke="#50e3c2" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <defs>
    <!-- Vercel Blue to Purple linear gradient -->
    <linearGradient id="paint0_linear" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop stop-color="#007cf0"/>
      <stop offset="0.5" stop-color="#7928ca"/>
      <stop offset="1" stop-color="#ff0080"/>
    </linearGradient>
    <filter id="dropShadow" x="20" y="10" width="60" height="70" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
</svg>
